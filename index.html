/* Layout: one scrolling liquid-glass page. Color orbs drift behind frosted, refracting panels with rim light that follows the pointer (or the scroll on touch). A draggable glass lens magnifies whatever it passes over. Floating glass tab bar with a sliding indicator. */
:root {
  --bg: #dde4ff;
  --fg: #0f1334;
  --muted: #474e7c;
  --glass: rgba(255, 255, 255, 0.26);
  --glass-strong: rgba(255, 255, 255, 0.46);
  --edge: rgba(255, 255, 255, 0.95);
  --edge-dim: rgba(255, 255, 255, 0.32);
  --shadow: rgba(38, 48, 130, 0.28);
  --orb1: #ff8fc4; --orb2: #6f9dff; --orb3: #b093ff; --orb4: #6fe6cf;
  --accent: #3d4bff;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070920; --fg: #f3f4ff; --muted: #cdd1f0;
    --glass: rgba(255, 255, 255, 0.07); --glass-strong: rgba(255, 255, 255, 0.15);
    --edge: rgba(255, 255, 255, 0.6); --edge-dim: rgba(255, 255, 255, 0.12); --shadow: rgba(0, 0, 0, 0.6);
    --orb1: #ff4f9a; --orb2: #3a5bff; --orb3: #8a5cff; --orb4: #14c9a8; --accent: #9aa8ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070920; --fg: #f3f4ff; --muted: #cdd1f0;
  --glass: rgba(255, 255, 255, 0.07); --glass-strong: rgba(255, 255, 255, 0.15);
  --edge: rgba(255, 255, 255, 0.6); --edge-dim: rgba(255, 255, 255, 0.12); --shadow: rgba(0, 0, 0, 0.6);
  --orb1: #ff4f9a; --orb2: #3a5bff; --orb3: #8a5cff; --orb4: #14c9a8; --accent: #9aa8ff; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  margin: 0;
  position: relative;
  overflow-x: hidden;
  padding-block: 28px 130px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
p, h1, h2, dl, dd, ul { margin: 0; padding: 0; }
